services:
  db:
    image: postgres:16
    container_name: muttmetrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: muttmetrics
      # From the repo-root .env (#93). Only used when the volume is first created:
      # changing it later needs ALTER USER, see docs/runbooks/db-peek.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: muttmetrics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - muttmetrics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muttmetrics -d muttmetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  muttmetrics_pgdata: