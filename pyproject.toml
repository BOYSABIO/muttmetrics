[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muttmetrics"
version = "0.1.0"
description = "Duration intelligence layer for a dog grooming business — schema, capture, P50/P90 priors."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Spencer Wood" }]
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muttmetrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
