# /etc/ssh/sshd_config.d/10-muttmetrics-hardening.conf  (#93)
# sshd keeps the FIRST value it reads for each setting, and reads this folder
# in name order, so "10-" wins over anything the distro or cloud-init drops in.
# Replace <admin> with the admin account's name. The app account (muttmetrics)
# is deliberately not listed: it has no SSH login.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers <admin>
MaxAuthTries 3
X11Forwarding no
