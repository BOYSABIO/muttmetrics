name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm-audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muttmetrics
          POSTGRES_PASSWORD: muttmetrics
          POSTGRES_DB: muttmetrics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muttmetrics -d muttmetrics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://muttmetrics:muttmetrics@localhost:5432/muttmetrics_test
      TEST_DATABASE_URL: postgresql+psycopg://muttmetrics:muttmetrics@localhost:5432/muttmetrics_test
      API_KEY: ci-test-key-not-for-production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"
      
      - name: pip-audit
        run: pip-audit

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Model drift
        # Fails if the SQLAlchemy models and the migrations disagree
        run: alembic check
      
      - name: Migration round-trip
        # Every downgrade() must work, and upgrade must rebuild from nothing
        run: |
          alembic downgrade base
          alembic upgrade head
      
      - name: Seed reference data
        run: python -m muttmetrics.seed
      
      - name: Smoke test database
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          from muttmetrics.config import get_settings
          url = get_settings().database_url
          with create_engine(url).connect() as conn:
              n_svc = conn.execute(text('SELECT COUNT(*) FROM service')).scalar_one()
              n_brd = conn.execute(text('SELECT COUNT(*) FROM breed')).scalar_one()
              n_high = conn.execute(text('SELECT COUNT(*) FROM breed WHERE matting_risk >= 4')).scalar_one()
              assert n_svc == 5, n_svc
              assert n_brd == 11, n_brd
              assert n_high >= 6, n_high
              print(f'OK: {n_svc} services, {n_brd} breeds, {n_high} high matting-risk')
          "

      - name: Pytest
        run: pytest
  
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muttmetrics
          POSTGRES_PASSWORD: muttmetrics
          POSTGRES_DB: muttmetrics_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muttmetrics -d muttmetrics_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://muttmetrics:muttmetrics@localhost:5432/muttmetrics_e2e
      API_KEY: ci-e2e-key-not-for-production
      VITE_API_KEY: ci-e2e-key-not-for-production
      PHOTO_ROOT: /tmp/muttmetrics-e2e-photos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Migrate, seed, demo fixtures
        run: |
          alembic upgrade head
          python -m muttmetrics.seed
          python ops/demo_data.py
      
      - name: Start API
        run: |
          mkdir -p "$PHOTO_ROOT"
          python -m uvicorn muttmetrics.api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1
      
      - name: Install frontend + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Build SPA
        working-directory: frontend
        run: npm run build
      
      - name: Playwright smoke
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-on-failure
          path: |
            frontend/test-results/
          if-no-files-found: ignore
