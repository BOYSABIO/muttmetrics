#!/usr/sbin/nft -f
# /etc/nftables.conf  (#93): host firewall for the MuttMetrics home server.
#
# Only touches its OWN table. Debian's default file starts with
# `flush ruleset`, which would also wipe Tailscale's and Docker's tables on
# every reload, so it's deliberately absent here.
# Reload: sudo systemctl reload nftables
#
# Replace WORKSTATION with the maintainer's workstation address on the LAN
# (192.0.2.10 is a documentation-only placeholder, RFC 5737).
define WORKSTATION = 192.0.2.10

table inet host_fw
delete table inet host_fw

table inet host_fw {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # Tailscale: anything arriving through the tunnel. The tailnet policy decides who.
    iifname "tailscale0" accept
    # Tailscale direct connections (WireGuard). Without this, traffic falls back to relays.
    udp dport 41641 accept

    # Basics: ping/path-MTU, IPv6 neighbour discovery, DHCP renewals
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    udp sport 67 udp dport 68 accept

    # LAN fallback: SSH from the workstation only (works when its Tailscale is off).
    # Traffic through a Tailscale subnet router arrives as the router's address,
    # so it can't be told apart, and is dropped here.
    ip saddr $WORKSTATION tcp dport 22 accept

    # Everything else is dropped; log a few so we can see what's knocking
    limit rate 5/minute burst 10 packets log prefix "host_fw drop: " level info
  }
}
