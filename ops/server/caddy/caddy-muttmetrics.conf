# /etc/systemd/system/caddy.service.d/muttmetrics.conf  (#93, #194)
# Caddy reads API_KEY (for header_up) from the app's .env.
# systemd reads this file as root before starting Caddy, so .env stays mode 600.
# Accepted trade-off: Caddy's environment also holds the DB password; the API
# key already gives full data access, and one file means one place to rotate.
[Service]
EnvironmentFile=/opt/muttmetrics/.env
